name: commitlint
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@833f8aca68b2cdd8d4a23b9f5a0be86a22e6ee3e # main
    permissions:
      contents: read
      actions: read
